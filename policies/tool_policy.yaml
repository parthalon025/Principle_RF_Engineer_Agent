  # converters and the one named optimization/correlation use case
  # (optimize_patch_length_for_target_frequency,
  # correlate_simulated_and_measured), which are themselves deterministic
  # searches/comparisons over calculated values, not open-ended actions.
  - calculate_wavelength
  - calculate_vswr
  - calculate_return_loss
  - calculate_cascade_gain
  - calculate_noise_figure
  - convert_db_to_linear
  - convert_linear_to_db
  - convert_s_to_z
  - convert_z_to_s
  - convert_s_to_y
  - convert_y_to_s
  - convert_s_to_abcd
  - convert_abcd_to_s
  - calculate_free_space_path_loss
  - calculate_link_budget_margin
  - calculate_cascade_output_ip3
  - calculate_oip3_from_iip3
  - calculate_iip3_from_oip3
  - calculate_third_order_intermod_output
  - calculate_third_order_intermod_dbc
  - calculate_stability_delta
  - calculate_rollett_k_factor
  - calculate_stability_verdict
  - calculate_output_stability_circle
  - calculate_input_stability_circle
  - calculate_quarter_wave_transformer_impedance
  - calculate_l_network_match
  - synthesize_filter_prototype
  - calculate_patch_effective_permittivity
  - calculate_patch_length_extension
  - calculate_patch_resonant_frequency
  - calculate_fractional_bandwidth_from_q
  - calculate_quality_factor_from_fractional_bandwidth
  - calculate_curvature_length_correction_factor
  - calculate_curvature_shifted_resonant_frequency
  - calculate_maxwell_garnett_effective_permeability
  - calculate_aperture_gain
  - correlate_simulated_and_measured
  - optimize_patch_length_for_target_frequency

simulation_auto:
  # Non-destructive, sandboxed simulator runs -- safe to run without
  # approval. run_hfss_simulation is deliberately NOT here: it enforces
  # its own licensed-workstation confinement check (simulation/hfss.py)
  # and is listed under approval_self_gated below instead. run_ltspice_
  # simulation (issue #59) belongs here, not approval_self_gated: it has
  # no comparable per-run physical/licensed-seat gate -- LTspice is free-
  # of-charge freeware with no workstation-confinement concern like HFSS's
  # paid AEDT license. run_qucs_simulation (issue #58, Qucs-S/qucsator_rf)
  # is free/GPL software with no license-confinement concern (unlike
  # run_ads under approval_required below), matching run_nec2_simulation/
  # run_openems_simulation exactly. Palace (issue #61) is open-source
  # (Apache-2.0) and has no licensing/workstation gate of its own -- see
  # simulation/palace.py. run_meep_simulation (issue #60) is free/open-
  # source FDTD driven as a Python library (no licensing gate needed,
  # unlike HFSS) -- same category as run_nec2_simulation/run_openems_
  # simulation.
  - run_nec2_simulation
  - run_openems_simulation
  - run_openparem_simulation
  - run_elmer_simulation
  - run_ltspice_simulation
  - run_qucs_simulation
  - run_kicad_gerber2ems_simulation
  - run_ngspice_simulation
  - run_xyce_simulation
  - run_palace_simulation
  - run_gprmax_simulation
  - run_meep_simulation
  # generate_freecad_curved_geometry (issue #66) is a geometry generator, not
  # a simulator run, but shares the same non-destructive/sandboxed threat
  # model as everything else in this category: it only writes to a local
  # workdir (no network, no credentials) and shells out to a locally-
  # installed, free/open-source tool (FreeCAD, LGPL-2.1-or-later) with no
  # licensing/workstation-confinement gate of its own -- see geometry/
  # freecad_curved.py.
  - generate_freecad_curved_geometry

approval_self_gated:
  # Real, currently-implemented tools that already refuse to act without
  # their own independent gate -- simulation/hfss.py's workstation
  # confinement check (run_hfss_simulation), or (ticket #67)
  # knowledge/sourcing_common.py's require_external_network_tools_enabled()
  # -- ALLOW_EXTERNAL_NETWORK_TOOLS=true, checked before any credential is
  # read or any outbound request is built -- for the three distributor
  # lookup tools, which place a real, credentialed call to a third party
  # the instant they run. Deliberately NOT listed under approval_required:
  # this policy file adds no second gate on top of an already-working one
  # -- see docs/adr's grilling notes and orchestration/policy.py's module
  # docstring for why a blanket approval_required block would just
  # double-gate (and, with no approval callback wired anywhere in this
  # codebase, permanently break) a tool that already works correctly
  # today.
  #
  # ticket #90 removed the SCPI/VISA instrument-actuation approval gate
  # (measurement/base.py) and its four measure_*/set_signal_generator_
  # output tools from this category -- and the instrument-approval-receipt
  # category below it (request_vna_measurement_approval and its three
  # siblings) entirely -- along with the instrument adapters themselves
  # (measurement/vna.py, spectrum_analyzer.py, signal_generator.py,
  # power_meter.py): this project no longer offers any physical-instrument
  # actuation capability, so there is nothing left to categorize here.
  - run_hfss_simulation
  - lookup_digikey_component
  - lookup_mouser_component
  - lookup_nexar_component

ingestion_auto:
  # issue #215: ingest_3gpp_spec/ingest_etsi_standard/ingest_fcc_rule join
  # ingest_arxiv_paper here, not approval_self_gated below, for the same
  # reason ingest_arxiv_paper itself is here rather than there (see
  # knowledge/sourcing/arxiv.py's module docstring, quoted in part below).
  # approval_self_gated exists for a tool that ALREADY enforces its own
  # independent gate before it runs -- concretely, knowledge/
  # sourcing_common.py's require_external_network_tools_enabled()
  # (ALLOW_EXTERNAL_NETWORK_TOOLS=true), which the three distributor lookups
  # (lookup_digikey_component/lookup_mouser_component/lookup_nexar_component)
  # call because each places a real, CREDENTIALED call to a third party
  # (an API key/secret read from the environment) the instant it runs. None
  # of the three new sourcing clients do that, or need to: 3GPP's FTP
  # archive, ETSI's deliver-path PDFs, and the FCC's eCFR versioner API are
  # each confirmed (in the sourcing clients' own module docstrings, from
  # each standards body's own documentation) to need no registration, no API
  # key, and no account of any kind -- "same ungated posture" as arXiv,
  # arxiv.py's own words. There is no self-gate to categorize them under
  # here; putting them in approval_self_gated anyway, with nothing behind
  # it, would misrepresent what actually happens at call time.
  #
  # issue #219: ingest_patent sits here, ungated, for exactly the reason
  # ingest_arxiv_paper does -- and deliberately NOT in approval_self_gated
  # beside the three distributor lookups. The distinction that category
  # actually draws is a CREDENTIAL: Digi-Key/Mouser/Nexar place an
  # authenticated, account-billed call to a third party the instant they
  # run, which is why knowledge/sourcing_common.py gates them. The USPTO
  # endpoint this client uses
  # (image-ppubs.uspto.gov/dirsearch-public/print/downloadPdf/<number>)
  # takes no API key, no account and no payment -- verified live against
  # five documents during the ticket -- so there is nothing to spend and
  # nobody to bill. What it does is write one document into this project's
  # own knowledge base, which is what every tool in this category does.
  #
  # It also spends no material, machine time or money, so it is nowhere near
  # the one hard stop this project keeps (nothing prints, orders or releases
  # without a human saying yes).
  # issue #257-T2: search_arxiv_papers (knowledge/sourcing/arxiv.py's
  # topic/keyword discovery search, issue #257-T1) sits here too, right
  # beside ingest_arxiv_paper -- same credential-free arXiv query API, same
  # ungated posture (it needs no account or credential, so there is no
  # self-gate to categorize it under approval_self_gated), same knowledge/
  # sourcing/ module. The one real difference from every other entry in
  # this category: it never itself writes a document -- it returns
  # candidates for review and never calls ingest_document (see its own
  # docstring and tests/test_sourcing_arxiv.py's
  # test_search_arxiv_papers_never_calls_ingest_document). It is not a
  # `calculation` (it derives nothing) and not `read_only` in that
  # category's own sense (it reaches an external network endpoint, not
  # just this project's own knowledge base) -- ingestion_auto, grouped by
  # "external, credential-free knowledge/sourcing operation," is still the
  # closest fit.
  - ingest_document
  - ingest_arxiv_paper
  - search_arxiv_papers
  - ingest_3gpp_spec
  - ingest_etsi_standard
  - ingest_fcc_rule
  - ingest_patent
  - index_document
  - extract_components
  - reconcile_component_sources

design_tracking:
  - create_design
  - record_decision
  - verify_requirement
  # issue #145: design-lifecycle transitions. Uncategorized as informational
  # because the constraints are enforced deterministically in the code --
  # ordering in designs/lifecycle.py, the RELEASED gate in
  # designs/release_approval.py -- not by a policy-layer check. Same reasoning
  # as the requirement-target tools below.
  #
  # Note on manufacturing_release (approval_required, below): this tool can
  # NAME RELEASED as a destination, but it cannot reach it. The gate requires
  # a signed DesignReleaseApprovalReceipt, and no workflow issues one, so a
  # release attempt returns release_not_approved rather than writing. The
  # autonomous release ACTION stays unbuilt and stays gated there; see
  # docs/adr/0016 for why the two coexist.
  - advance_design_status
  # issue #92: interpreting a prose customer requirement into a proposed/
  # confirmed/unscoreable requirement target. Same informational-only
  # category as create_design/verify_requirement -- no runtime gate: the
  # only thing that could make a fabricated target dangerous (an LLM
  # inventing a number) is prevented deterministically inside
  # designs/requirement_targets.py itself (shape validation, ASSUMED
  # tagging), not by a policy-layer gate.
  - propose_requirement_target
  - mark_requirement_unscoreable
  - confirm_requirement_target

design_loop:
  # The controlled design-iteration loop (orchestration/design_loop.py,
  # issue #46). Its own ARCHITECTURE/MEASUREMENT/REDESIGN_DECISION gate is
  # enforced internally by orchestration/approval.py, independently of
  # this policy file -- this category is informational only, same as
  # design_tracking.
  - start_design_loop
  - advance_design_loop_step
  - inspect_design_loop_state
  # issue #94: compiles a batched lab-test plan from a loop's own already-
  # recorded requirements/decisions. Read-only like inspect_design_loop_
  # state above -- no mutation, no database write beyond an optional fresh
  # read, no LoopStepApprovalReceipt of any kind (there is nothing gated
  # for it to check).
  - compile_lab_test_plan
  # issue #95: the candidate solver. Drives ONLY the loop's already-
  # ungated ANALYSIS/SIMULATION/OPTIMIZATION span (orchestration/
  # solver.py's _ORDERED_UNGATED_SPAN) via advance_design_loop_step --
  # never GATED_STEPS, never an approval receipt. Same informational-only
  # category as its sibling design-loop tools: the real defense is
  # structural (this tool never constructs or accepts a
  # LoopStepApprovalReceipt, and halts with a pending-approval report the
  # instant the loop state handed to it sits at a gated step), not a
  # policy-layer gate.
  - run_candidate_search

approval_required:
  # Real gate, no exceptions -- but every entry here is a capability that
  # does NOT exist as an implemented tool yet. Kept here (rather than
  # deleted) so that if one is ever built, it starts gated by default
  # instead of shipping unguarded because nobody remembered to add it.
  # manufacturing_release never will exist as an autonomous action at all
  # -- see orchestration/design_loop.py's "NO MANUFACTURING-RELEASE PATH"
  # and docs/adr/0005.
  - run_ads
  - modify_controlled_design
  - change_calibration_state
  - manufacturing_release

blocked_by_default:
  # None of these exist as implemented tools either -- blocked by
  # non-existence today. Listed so a future proposal for any of them
  # starts blocked, not allowed by omission.
  - arbitrary_shell
  - arbitrary_network_request
  - delete_design
  - delete_measurement
  - procurement
