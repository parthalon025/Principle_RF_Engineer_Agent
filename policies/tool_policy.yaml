# Tool permission classification for every agent/MCP tool wired in
# agent/main.py and mcp_server/server.py (kept in sync by construction --
# both files register the same tool set). Enforced by orchestration/policy.py:
#
#   - blocked_by_default tools always refuse.
#   - approval_required tools refuse unless a valid approval is presented
#     (no such tool is implemented today -- see that category below).
#   - every other category is documentation only; no runtime gate.
#   - a tool NOT LISTED under any category here is refused too (fail
#     closed) -- orchestration/policy.py.assert_all_tools_categorized()
#     checks this at import time, in both agent/main.py and
#     mcp_server/server.py, precisely so a newly added tool can't ship
#     unguarded just because nobody remembered to update this file.
#
# `/grill-with-docs` on the RF tool orchestration flow (2026-09) found this
# file badly out of date against the real tool names (run_hfss/run_nec/
# run_openems/analyze_touchstone/calculate_link_budget/calculate_ip3 none
# matched anything real; run_qucs/run_ads/modify_controlled_design/
# change_instrument_configuration/start_rf_transmission/
# change_calibration_state/read_touchstone/delete_design/delete_measurement/
# procurement didn't exist as tools at all; the four measurement
# approval-granting tools and the three design-loop tools weren't mentioned
# anywhere) and rewrote it against the actual tool list.

read_only:
  # No side effects (no DB write, no I/O beyond reading a file/the
  # knowledge base) -- covers pure queries and pure derived-data
  # transforms (Touchstone interpolation/de-embedding/cascading/
  # comparison produce new data but touch nothing external).
  - search_knowledge
  - search_design_records
  - read_document
  - read_design
  - analyze_touchstone_file
  - interpolate_touchstone_file
  - deembed_touchstone_file
  - cascade_touchstone_files
  - compare_touchstone_files

