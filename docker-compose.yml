services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rfengineer
      POSTGRES_USER: rf
      # Same default as ever for local dev -- override via .env (or the
      # shell environment) to use a real secret instead, e.g. before this
      # ever runs on a shared or cloud host. If you do, also update
      # DATABASE_URL's password in .env to match: docker compose
      # substitutes ${POSTGRES_PASSWORD} for the containers below
      # automatically, but a host-run script/test reads DATABASE_URL as a
      # plain literal, so it does not auto-follow.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rf_dev_password}
      # Read from the host/.env at `docker compose` invocation time.
      # EMBEDDING_DIM_LOCAL defaults to 1024 (BAAI/bge-m3's actual, fixed
      # dense-embedding dimension -- see knowledge/embedding.py and
      # docs/adr/0004-self-hosted-backend-for-restricted-data.md); it is NOT
      # the same value as EMBEDDING_DIM_EXTERNAL by coincidence-of-defaults,
      # they are two independent columns for two independent models.
      EMBEDDING_DIM_EXTERNAL: ${EMBEDDING_DIM_EXTERNAL:-1536}
      EMBEDDING_DIM_LOCAL: ${EMBEDDING_DIM_LOCAL:-1024}
    ports:
      # Loopback-only, both stacks: this database holds RESTRICTED-
      # classification document text (ADR-0001/ADR-0004), so it should not
      # be reachable from other machines by default. Both IPv4 (127.0.0.1)
      # and IPv6 ([::1]) loopback are bound explicitly -- binding only one
      # is a real footgun: "localhost" on a dual-stack host (confirmed on
      # this workstation) resolves to BOTH ::1 and 127.0.0.1, and a client
      # that tries the IPv6 address first hangs for the OS's full TCP
      # retransmission window (20s+) against a port nothing is listening on,
      # before ever falling back to IPv4 -- found live, mid-session, as a
      # reproducible pytest hang traced via psycopg.connect() hanging on
      # `localhost` but returning instantly on an explicit `127.0.0.1`.
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      - rf_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql.template:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/001_schema.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rf -d rfengineer"]
      interval: 5s
      timeout: 5s
      retries: 20

  # In plain terms: this is the free, self-hosted stand-in for the paid
  # OpenAI API (docs/FREE_AND_OPEN_SOURCE_TOOLING.md, "Self-hosted / free
  # LLM & embedding backends"). It serves both the agent's own reasoning
  # (agent/main.py, LLM_PROVIDER=local) and the knowledge base's local
  # embeddings/extraction (ADR-0004, DEFAULT_LLM_BACKEND=local) from one
  # OpenAI-compatible HTTP API. This service alone is NOT enough, though --
  # a bare `ollama` container has no models loaded; see ollama-pull below,
  # which is what actually makes "nothing outside this repo needs to be
  # running separately" true end to end.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uses the host's NVIDIA GPU when the NVIDIA Container Toolkit is
    # installed (confirmed present on this workstation); Ollama itself
    # falls back to CPU automatically if this reservation can't be
    # satisfied on a given host, but on a host with no nvidia runtime
    # registered at all, remove this block or `docker compose up` will
    # fail to start this specific service.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot: pulls whatever models .env actually specifies (LOCAL_AGENT_MODEL/
  # LOCAL_EXTRACTION_MODEL/LOCAL_EMBEDDING_MODEL -- falling back to this
  # project's documented defaults, gpt-oss:20b and bge-m3, only for whichever
  # of those .env leaves unset) into the ollama service above, then exits.
  # Reads from the SAME .env file at the repo root -- docker compose
  # substitutes ${VAR} in this file from it automatically, no separate
  # env_file: needed here. Without this, `ollama` starts with zero models
  # loaded and every local LLM_PROVIDER/DEFAULT_LLM_BACKEND call fails on
  # first use -- this is what closes that gap so the whole stack is
  # genuinely usable from a cold `docker compose up` with no manual
  # `ollama pull` step. Re-running is cheap: `ollama pull` on an
  # already-present model is a fast no-op, not a re-download -- so pulling
  # LOCAL_AGENT_MODEL and LOCAL_EXTRACTION_MODEL separately even when
  # they're the same model (this repo's usual case) costs nothing extra.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      AGENT_MODEL: ${LOCAL_AGENT_MODEL:-gpt-oss:20b}
      EXTRACTION_MODEL: ${LOCAL_EXTRACTION_MODEL:-gpt-oss:20b}
      EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-bge-m3}
    entrypoint: ["sh", "-c"]
    command:
      - "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull \"$$AGENT_MODEL\" && ollama pull \"$$EXTRACTION_MODEL\" && ollama pull \"$$EMBEDDING_MODEL\""
    restart: "no"

  # The whole program plus every solver/geometry binary the Dockerfile can
  # install on Linux -- see Dockerfile's own header comment for what's in
  # here and why (several tools, e.g. MEEP, have no native Windows path at
  # all). Not a long-running server by default (mcp_server/server.py speaks
  # stdio, not a network port) -- meant for `docker compose run app <cmd>`,
  # e.g. `docker compose run --rm app uv run pytest`.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://rf:${POSTGRES_PASSWORD:-rf_dev_password}@postgres:5432/rfengineer
      LOCAL_LLM_BASE_URL: http://ollama:11434/v1
    volumes:
      # Live code sync (edit on the host, no rebuild needed to pick it up)
      # -- but NOT the host's own .venv: that's a Windows-native venv with
      # incompatible binaries, and bind-mounting it over the image's
      # Linux-built one would break every import. app_venv (below) is a
      # separate named volume specifically so /app/.venv inside the
      # container stays backed by container-native storage, persisting
      # across `docker compose run` invocations without the host's .venv
      # ever shadowing it.
      - .:/app
      - app_venv:/app/.venv

volumes:
  rf_pgdata:
  ollama_data:
  app_venv:
