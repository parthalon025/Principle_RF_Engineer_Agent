services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rfengineer
      POSTGRES_USER: rf
      POSTGRES_PASSWORD: rf_dev_password
    ports:
      - "5432:5432"
    volumes:
      - rf_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rf -d rfengineer"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rf_pgdata:
