[project]
name = "principal-rf-engineer"
version = "0.1.0"
description = "Internal AI-assisted principal RF engineer workstation"
requires-python = ">=3.12"
dependencies = [
  "openai-agents>=0.17.4,<1",
  "mcp>=1.19,<2",
  "scikit-rf>=1.8",
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "pydantic>=2.12",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "python-dotenv>=1.0",
  "rich>=13.9",
  "docling>=2.124.0",
  "pyyaml>=6.0",
  # LLM_PROVIDER=anthropic routing (agent/main.py) via openai-agents' own
  # LiteLLM extension (agents.extensions.models.litellm_model.LitellmModel);
  # free/OSS, no hardware requirement, so a hard dependency like
  # openai-agents itself rather than an optional extra.
  "litellm>=1.55",
]

[project.optional-dependencies]
# HFSS simulation (issue #40) is confined to a controlled, licensed
# workstation -- see simulation/hfss.py. pyaedt is a large Ansys-adjacent
# package that most installs (including CI) will never touch, so it is an
# explicit optional extra, not a hard dependency: install with
# `uv sync --extra hfss` or `pip install '.[hfss]'` on that workstation.
hfss = [
  "pyaedt",
]
# SCPI/VISA instrument adapters (issue #43) -- see measurement/vna.py.
# pyvisa requires a real VISA backend (NI-VISA, Keysight IO Libraries, or
# the pure-Python pyvisa-py) and, for anything beyond *IDN? against a
# simulated resource, real lab hardware, neither of which CI or most
# installs have -- so it is an explicit optional extra, not a hard
# dependency: install with `uv sync --extra measurement` or
# `pip install '.[measurement]'` on a workstation with real instrument
# access.
#
# pyvisa-py (issue #56) is pyvisa's own pure-Python VISA backend (the "py"
# wrapper -- see pyvisa's highlevel.py get_wrapper_class/_get_default_wrapper),
# a free alternative to a vendor VISA install (NI-VISA/Keysight IO Libraries)
# for real serial/USB/TCPIP instrument access -- bundled alongside pyvisa-sim
# below since both are pure-Python, no-hardware-required, and this ticket's
# @sim-backed tests exercise the same bare `pyvisa.ResourceManager()` call
# real hardware access would use.
#
# pyvisa-sim (issue #56) is pyvisa's own simulated-instrument backend
# (selected via the `@sim` resource-manager specification, or the
# PYVISA_LIBRARY env var -- see pyvisa's highlevel.py: an unspecified
# ResourceManager() falls back to os.environ["PYVISA_LIBRARY"] verbatim, and
# `@sim` resolves by pyvisa's own package-naming convention to the installed
# `pyvisa_sim` package's WRAPPER_CLASS -- both verified directly against
# pyvisa's GitHub `main` branch, not assumed). It requires no real VISA
# backend and no physical hardware at all, unlike bare pyvisa above -- so a
# developer with this extra installed can exercise measurement/vna.py,
# measurement/spectrum_analyzer.py, measurement/signal_generator.py, and
# measurement/power_meter.py end-to-end against the repo-specific fixture at
# tests/fixtures/pyvisa_sim_instruments.yaml (see tests/test_pyvisa_sim.py).
measurement = [
  "pyvisa",
  "pyvisa-py",
  "pyvisa-sim",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
# setuptools' `find:` include patterns match on the full dotted package
# name, not a directory prefix -- "knowledge" alone would not pull in the
# "knowledge.sourcing" subpackage (ticket #68's 3GPP/ETSI/FCC/arXiv thin
# clients), so it is listed explicitly, same as every other top-level entry.
include = ["agent", "rf_tools", "mcp_server", "simulation", "knowledge", "knowledge.sourcing", "optimization", "measurement", "orchestration", "designs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
