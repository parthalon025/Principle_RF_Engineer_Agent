[project]
name = "principal-rf-engineer"
version = "0.1.0"
description = "Internal AI-assisted principal RF engineer workstation"
requires-python = ">=3.12"
dependencies = [
  "openai-agents>=0.17.4,<1",
  "mcp>=1.19,<2",
  "scikit-rf>=1.8",
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "pydantic>=2.12",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "python-dotenv>=1.0",
  "rich>=13.9",
  "docling>=2.124.0",
  "pyyaml>=6.0",
  # Reads gprMax's own native .out result format (simulation/gprmax.py,
  # issue #63) -- h5py is free/open-source, needs no special hardware or
  # license (unlike the hfss/measurement extras below), and this module's
  # own tests construct synthetic .out files with it to exercise result
  # parsing without gprMax itself installed -- so, unlike pyaedt/pyvisa,
  # it is a hard dependency, not an optional extra. (gprMax itself is NOT
  # pip-installable -- see simulation/gprmax.py's module docstring -- so
  # it has no extra of its own here; it is documented in README.md's
  # Optional tools list instead, same as NEC2++/openEMS.)
  "h5py>=3.11",
  # LLM_PROVIDER=anthropic routing (agent/main.py) via openai-agents' own
  # LiteLLM extension (agents.extensions.models.litellm_model.LitellmModel);
  # free/OSS, no hardware requirement, so a hard dependency like
  # openai-agents itself rather than an optional extra.
  "litellm>=1.55",
]

[project.optional-dependencies]
# HFSS simulation (issue #40) is confined to a controlled, licensed
# workstation -- see simulation/hfss.py. pyaedt is a large Ansys-adjacent
# package that most installs (including CI) will never touch, so it is an
# explicit optional extra, not a hard dependency: install with
# `uv sync --extra hfss` or `pip install '.[hfss]'` on that workstation.
hfss = [
  "pyaedt",
]
# SCPI/VISA instrument adapters (issue #43) -- see measurement/vna.py.
# pyvisa requires a real VISA backend (NI-VISA, Keysight IO Libraries, or
# the pure-Python pyvisa-py) and, for anything beyond *IDN? against a
# simulated resource, real lab hardware, neither of which CI or most
# installs have -- so it is an explicit optional extra, not a hard
# dependency: install with `uv sync --extra measurement` or
# `pip install '.[measurement]'` on a workstation with real instrument
# access.
measurement = [
  "pyvisa",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["agent", "rf_tools", "mcp_server", "simulation", "knowledge", "optimization", "measurement", "orchestration", "designs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
