[project]
name = "principal-rf-engineer"
version = "0.1.0"
description = "Internal AI-assisted principal RF engineer workstation"
requires-python = ">=3.12"
dependencies = [
  "openai-agents>=0.17.4,<1",
  "mcp>=1.19,<2",
  "scikit-rf>=1.8",
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "pydantic>=2.12",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "python-dotenv>=1.0",
  "rich>=13.9",
  "docling>=2.124.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["agent", "rf_tools", "mcp_server", "simulation", "knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
