[project]
name = "principal-rf-engineer"
version = "0.1.0"
description = "Internal AI-assisted principal RF engineer workstation"
requires-python = ">=3.12"
dependencies = [
  "openai-agents>=0.17.4,<1",
  "mcp>=1.19,<2",
  "scikit-rf>=1.8",
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "pydantic>=2.12",
  "psycopg[binary]>=3.2",
  # The shared connection pool behind designs/db.py's and knowledge/db.py's
  # get_connection() (issue #406). psycopg-pool is psycopg's own companion
  # package -- same maintainers, same release train, LGPL like psycopg
  # itself -- so it adds no new licence row and no new transitive
  # dependency beyond psycopg, which is already a hard dependency here.
  # It is NOT an optional extra: every database-touching code path in this
  # repo goes through those two get_connection() functions, so an install
  # without it could not talk to Postgres at all.
  #
  # >=3.3 specifically, not >=3.2: db/pool.py depends on `close_returns=True`
  # -- the option that makes a caller's `conn.close()` a return to the pool
  # rather than a disconnect -- and that option first exists in 3.3. Without
  # it every existing `conn.close()` call site would have to change.
  "psycopg-pool>=3.3",
  "pgvector>=0.3",
  "python-dotenv>=1.0",
  "rich>=13.9",
  "docling>=2.124.0",
  "pyyaml>=6.0",
  # Reads gprMax's own native .out result format (simulation/gprmax.py,
  # issue #63) -- h5py is free/open-source, needs no special hardware or
  # license (unlike the hfss extra below), and this module's
  # own tests construct synthetic .out files with it to exercise result
  # parsing without gprMax itself installed -- so, unlike pyaedt,
  # it is a hard dependency, not an optional extra. (gprMax itself is NOT
  # pip-installable -- see simulation/gprmax.py's module docstring -- so
  # it has no extra of its own here; it is documented in README.md's
  # Optional tools list instead, same as NEC2++/openEMS.)
  "h5py>=3.11",
  # LLM_PROVIDER=anthropic routing (agent/main.py) via openai-agents' own
  # LiteLLM extension (agents.extensions.models.litellm_model.LitellmModel);
  # free/OSS, no hardware requirement, so a hard dependency like
  # openai-agents itself rather than an optional extra.
  "litellm>=1.55",
  # Metamaterial/FSS unit-cell geometry composition and artwork export
  # (geometry/unit_cell.py, issue #55; SVG/GDSII export, issue #348).
  # Promoted from the `geometry` optional extra below: issue #348 found the
  # capability effectively unreachable from a real run because most installs
  # (including CI) never opted into that extra, and -- unlike hfss/ltspice's
  # extras just below, each gating an actual hardware/license requirement --
  # gdstk has neither: a small, freely pip-installable library with
  # prebuilt wheels for every major platform, so there is no install-time
  # cost to making it a hard dependency the way there would be for pyaedt
  # or spicelib.
  "gdstk",
]

[project.optional-dependencies]
# HFSS simulation (issue #40) is confined to a controlled, licensed
# workstation -- see simulation/hfss.py. pyaedt is a large Ansys-adjacent
# package that most installs (including CI) will never touch, so it is an
# explicit optional extra, not a hard dependency: install with
# `uv sync --extra hfss` or `pip install '.[hfss]'` on that workstation.
hfss = [
  "pyaedt",
]
# Metamaterial/FSS unit-cell geometry generation (issue #55, geometry/
# unit_cell.py) no longer has an extra here -- gdstk moved to a hard
# dependency above (issue #348). CSXCAD (the C++/Python library whose own
# <Polygon> XML element shape simulation/openems.py's polygon primitive
# was verified against, see that module's docstring citation) is still
# DELIBERATELY absent from this file entirely, geometry-format counterpart
# to gdstk or not: unlike gdstk, CSXCAD ships no installable package on the
# PyPI index -- its own install docs (docs.openems.de/python/install.html)
# require building from source (`python setup.py install`) or downloading
# a platform-specific pre-built .whl file directly, not `pip install
# CSXCAD` -- so per this project's own convention (a manual binary/source
# install belongs in README.md's Optional tools list, not a pyproject
# entry -- matching how NEC2++/openEMS are already handled there), CSXCAD
# stays documented in README.md instead. Both CSXCAD's and gdstk's
# licenses are still recorded, as separate rows, in docs/LICENSE_MATRIX.md
# regardless of which one is a pyproject dependency.
# LTspice circuit simulation (issue #59) -- see simulation/ltspice.py. spicelib
# drives LTspice's own documented batch/command-line switches and parses its
# .raw output; LTspice itself is free-of-charge proprietary freeware (Analog
# Devices SLA, see docs/LICENSE_MATRIX.md) that most installs (including CI,
# where no LTspice binary exists) will never touch, so -- like hfss
# above -- this is an explicit optional extra, not a hard
# dependency: install with `uv sync --extra ltspice` or
# `pip install '.[ltspice]'` on a workstation with LTspice installed.
ltspice = [
  "spicelib",
]
# KiCad IPC-API PCB geometry export (issue #65) -- see
# simulation/kicad_gerber2ems.py. kicad-python (imported as `kipy`) is a
# thin client that connects to a running/headless KiCad instance; it is
# useless without a real KiCad + kicad-cli install (a manual/system
# dependency, see README.md's Optional-tools list) and without the
# separate gerber2ems/gerbv/openEMS tools that same module's pipeline
# shells out to -- none of which most installs (including CI) will ever
# touch, so it is an explicit optional extra, not a hard dependency:
# install with `uv sync --extra kicad` or `pip install '.[kicad]'` on a
# workstation with KiCad installed.
kicad = [
  "kicad-python",
]
# Reading a solver's own field output for the Field bundle (issue #337) --
# PyVista wraps VTK and reads Palace's ParaView `.vtu`/`.pvd` output
# natively, including the multi-cycle `.pvd` manifest Palace writes (one
# cycle per sweep frequency). meshio is DELIBERATELY NOT listed here even
# though it is the obvious lighter-weight alternative: it hard-rejects the
# VTU version and the `PUnstructuredGrid` wrapper Palace actually writes
# (nschloe/meshio#1322), so it throws on every real Palace file. VTK also
# brings the gradient filter the field-aware divergence check needs, so no
# separate finite-difference package is required. This pulls ~80 MB of VTK
# that CI and every install without a Palace run will never touch, so --
# like hfss/geometry/ltspice/kicad above -- it is an explicit optional
# extra: `uv sync --extra viz` or `pip install '.[viz]'`.
viz = [
  "pyvista",
]
# Conformal/curved unit-cell meshing (issue #337) -- MFEM, the mesh library
# Palace itself reads through, natively loads Gmsh `.msh` v2.2 and v4.1
# including periodic meshes, which is what makes a FreeCAD STEP export
# reachable by Palace with no conversion layer. Gmsh ships a native Windows
# wheel and is already apt-installed in this repo's Docker image, but most
# installs (including CI) never mesh anything, so it is an optional extra:
# `uv sync --extra meshing` or `pip install '.[meshing]'`. TetGen and CGAL
# are deliberately not listed -- both carry licence complexity Gmsh avoids.
meshing = [
  "gmsh",
]
# Manufacturing-tolerance ensembles (issue #337). SALib ranks which
# parameters actually move the result; chaospy builds a polynomial-chaos
# surrogate, which matters here because every "sample" is a full-wave solve
# -- roughly 35-70 runs for four smooth variables against the
# hundreds-to-thousands brute Monte Carlo needs, i.e. hours instead of days.
# OpenTURNS is deliberately not listed (a 65 MB wheel for the same job) and
# neither is Dakota (worst integration fit of the options surveyed). Both
# packages here are pure Python over numpy/scipy, which this project already
# depends on, but nothing outside a tolerance study imports them, so they
# are an optional extra: `uv sync --extra uq` or `pip install '.[uq]'`.
uq = [
  "salib",
  "chaospy",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
# setuptools' `find:` include patterns match on the full dotted package
# name, not a directory prefix -- "knowledge" alone would not pull in the
# "knowledge.sourcing" subpackage (ticket #68's 3GPP/ETSI/FCC/arXiv thin
# clients), so it is listed explicitly, same as every other top-level entry.
#
# "db" is listed for db/pool.py alone -- the shared connection pool (issue
# #406) that designs/db.py and knowledge/db.py both check connections out
# of. It lives in db/ because that directory is already this repo's
# database home (schema.sql, apply_schema.py, docker-init.sh) and because
# neither designs/ nor knowledge/ can own a module the other imports
# without inventing a dependency between two peer packages. db/schema.sql
# and db/docker-init.sh are data/shell files, not modules, so nothing else
# in that directory is affected by it becoming an importable package.
include = ["agent", "rf_tools", "mcp_server", "simulation", "knowledge", "knowledge.sourcing", "optimization", "measurement", "orchestration", "designs", "geometry", "verification", "db", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# .claude/skills/ holds vendored Claude Code skills (e.g. arxiv-doc-builder),
# each its own independently-maintained package with its own tooling/style
# conventions -- not this repo's own source. Linting/formatting them against
# this repo's rules would just produce diff noise against upstream on every
# skill update, and the arxiv-doc-builder skill already found this out: its
# checked-in style didn't match this select/line-length pair (CI's `ruff
# check .` failing on 50 pre-existing issues there, none of them in this
# repo's own code, is what surfaced the gap).
exclude = [".claude/skills"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
